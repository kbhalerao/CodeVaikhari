<!doctype html>
<html><head><meta charset="utf-8">
<title>Code Vaikhari</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="icon" href="/logo.svg" type="image/svg+xml">
<style>
:root{
  --bg:#f7f6f4; --panel:#fff; --fg:#191817; --dim:#6f6c67; --faint:#9b9791;
  --line:#e4e1dc; --line-soft:#eeecE8;
  --accent:#2f6df6; --accent-fg:#fff;
  --warn:#a35a06; --warn-bg:#fdf3e0; --warn-line:#f0d9ae;
  --live:#1a9f52;
  --radius:10px;
}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){
  --bg:#141417; --panel:#1c1c21; --fg:#e9e7e4; --dim:#9a968f; --faint:#6d6a65;
  --line:#2b2b32; --line-soft:#232329;
  --accent:#6f9dff; --accent-fg:#0d1220;
  --warn:#f0b34a; --warn-bg:#33280f; --warn-line:#4d3c16;
  --live:#43c97c;
}}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);
  font:14.5px/1.5 ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  -webkit-font-smoothing:antialiased}
button,select,input{font:inherit;color:inherit}
button{cursor:pointer}

.app{display:grid;grid-template-columns:376px 1fr;height:100%;
  transition:grid-template-columns .18s ease}
.app.collapsed{grid-template-columns:0 1fr}
.app.collapsed aside{display:none}
.railtoggle{background:transparent;border:1px solid var(--line);border-radius:8px;
  padding:6px 10px;font-size:14px;line-height:1;color:var(--dim);flex:none}
.railtoggle:hover{border-color:var(--accent);color:var(--accent)}

/* ---------------------------------------------------------- sidebar */
aside{background:var(--panel);border-right:1px solid var(--line);
  display:flex;flex-direction:column;min-height:0;min-width:0}
.brand{display:flex;align-items:baseline;gap:8px;padding:16px 18px 12px;
  font-weight:650;font-size:15px;letter-spacing:-.015em}
.brand .st{margin-left:auto;font-size:11px;font-weight:500;color:var(--dim)}
.brand .logo{flex:none;align-self:center;color:var(--accent)}
.controls{display:flex;gap:7px;padding:0 18px 14px}
.controls button{flex:1;background:transparent;border:1px solid var(--line);
  border-radius:8px;padding:7px 0;font-size:12.5px;font-weight:550;color:var(--dim)}
.controls button:hover{border-color:var(--accent);color:var(--fg)}
.controls button.on{background:var(--warn-bg);border-color:var(--warn-line);color:var(--warn)}

.sec{padding:11px 18px 6px;font-size:10.5px;font-weight:700;letter-spacing:.08em;
  text-transform:uppercase;color:var(--faint);border-top:1px solid var(--line-soft)}
.scroll{overflow-y:auto;flex:1;min-height:0;padding:0 12px 12px}

.sess{border-radius:var(--radius);padding:10px;margin-bottom:6px;
  border:1px solid transparent;display:flex;gap:12px;align-items:center}
.sess .col{flex:1;min-width:0}
.sess:hover{background:var(--bg)}
.sess.dead{opacity:.5}
.sess .hd{display:flex;align-items:center;gap:8px;min-height:20px}
.av{flex:none;display:block;border-radius:50%;object-fit:cover;
  background:var(--line)}
.meta .av{margin-right:1px}
.pip{width:7px;height:7px;border-radius:50%;background:var(--live);flex:none;
  margin-left:auto}
.sess.dead .pip{background:var(--faint)}
.sess .nm{font-weight:600;font-size:14px;overflow:hidden;text-overflow:ellipsis;
  white-space:nowrap;min-width:0}
.sess .path{font-size:11.5px;color:var(--faint);margin:3px 0 8px 0;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sess .vr{display:flex;gap:5px}
.sess select{flex:1;min-width:0;background:var(--bg);border:1px solid var(--line);
  border-radius:7px;padding:5px 7px;font-size:12px}
.hear{background:transparent;border:1px solid var(--line);border-radius:7px;
  padding:4px 8px;font-size:11px;color:var(--dim)}
.hear:hover{border-color:var(--accent);color:var(--accent)}
.none{color:var(--faint);font-size:12.5px;padding:10px 6px}

/* ---------------------------------------------------------- prefs */
.prefs{border-top:1px solid var(--line);padding:0 18px 16px;background:var(--panel)}
.pref{display:flex;align-items:center;gap:9px;font-size:12.5px;color:var(--dim);
  padding:7px 0}
.pref label{display:flex;align-items:center;gap:8px;cursor:pointer;flex:1}
.pref input[type=number]{width:52px;background:var(--bg);border:1px solid var(--line);
  border-radius:7px;padding:4px 6px;font-size:12.5px;text-align:center}
.pref .hint{font-size:11px;color:var(--faint);line-height:1.4;padding-bottom:4px}
input[type=checkbox]{accent-color:var(--accent);width:15px;height:15px}

/* ---------------------------------------------------------- main */
main{display:flex;flex-direction:column;min-width:0;min-height:0}
.top{display:flex;align-items:center;gap:14px;padding:18px 24px 14px;
  border-bottom:1px solid var(--line)}
h2{margin:0;font-size:17px;font-weight:650;letter-spacing:-.01em}
.cnt{background:var(--warn-bg);color:var(--warn);border:1px solid var(--warn-line);
  border-radius:20px;padding:1px 9px;font-size:12px;font-weight:650;margin-left:8px}
.cnt.zero{background:transparent;border-color:var(--line);color:var(--faint)}
.grow{flex:1}
.big{background:var(--accent);color:var(--accent-fg);border:none;border-radius:9px;
  padding:11px 22px;font-size:14px;font-weight:650;letter-spacing:-.005em;
  box-shadow:0 1px 2px rgba(0,0,0,.14)}
.big:hover{filter:brightness(1.08)}
.big:disabled{background:var(--line);color:var(--faint);box-shadow:none;cursor:default;
  filter:none}
.big.ghost{background:transparent;color:var(--dim);border:1px solid var(--line);
  box-shadow:none;font-weight:600}
.big.ghost:hover{border-color:var(--accent);color:var(--accent);filter:none}
.big.ghost:disabled{background:transparent;color:var(--faint);border-color:var(--line-soft)}
.feed{overflow-y:auto;flex:1;min-height:0;padding:16px 24px 48px}

.msg{background:var(--panel);border:1px solid var(--line);border-radius:12px;
  padding:13px 15px;margin-bottom:10px;display:grid;
  grid-template-columns:1fr auto;gap:4px 14px;align-items:start}
.msg.pending{border-color:var(--warn-line);box-shadow:inset 3px 0 0 var(--sc)}
.msg.done{opacity:.62}
.meta{display:flex;align-items:center;gap:9px;font-size:11.5px;color:var(--faint);
  flex-wrap:wrap;grid-column:1;min-height:40px}
.tag{background:var(--sc);color:#fff;border-radius:20px;padding:1.5px 9px;
  font-size:11px;font-weight:650}
.unheard{background:var(--warn-bg);color:var(--warn);border:1px solid var(--warn-line);
  border-radius:20px;padding:.5px 7px;font-size:10px;font-weight:700;letter-spacing:.04em}
.body{grid-column:1;font-size:14.5px;margin:3px 0 8px;white-space:pre-wrap;
  word-break:break-word}
.acts{grid-column:2;grid-row:1/4;display:flex;flex-direction:column;gap:6px;
  align-items:stretch}
.dismiss{background:transparent;border:1px solid var(--accent);color:var(--accent);
  border-radius:8px;padding:7px 15px;font-size:12.5px;font-weight:600;white-space:nowrap}
.dismiss:hover{background:var(--accent);color:var(--accent-fg)}
.del{background:transparent;border:1px solid var(--line);color:var(--faint);
  border-radius:8px;padding:5px 0;font-size:12px}
.del:hover{border-color:#d4482f;color:#d4482f}
audio{grid-column:1;height:32px;width:100%;max-width:380px}
.divider{display:flex;align-items:center;gap:12px;margin:26px 0 14px;
  font-size:10.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;
  color:var(--faint)}
.divider:after{content:"";flex:1;height:1px;background:var(--line)}
.empty{text-align:center;color:var(--faint);padding:64px 20px;font-size:14px}
.empty b{display:block;color:var(--dim);font-size:15.5px;margin-bottom:5px;font-weight:600}

/* Every action hits a daemon that may be mid-utterance, so nothing is
   instant. Show it working rather than looking dead. */
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
.busy{position:relative;color:transparent!important;pointer-events:none}
.busy>*{visibility:hidden}
.busy::after{content:"";position:absolute;inset:0;margin:auto;width:14px;height:14px;
  border:2px solid currentColor;border-top-color:transparent;border-radius:50%;
  animation:spin .6s linear infinite;color:var(--dim)}
.big.busy::after{color:var(--accent-fg);width:16px;height:16px}
.big.ghost.busy::after,.dismiss.busy::after,.del.busy::after,.hear.busy::after{color:var(--accent)}
.speaking{display:inline-flex;align-items:center;gap:5px;color:var(--live);font-weight:600}
.speaking i{width:6px;height:6px;border-radius:50%;background:var(--live);
  animation:pulse 1s ease-in-out infinite;display:block}

@media(max-width:900px){
  /* Stacked, and everything sized for a phone: an 80px portrait plus a voice
     picker does not fit 390px, and clipped controls are worse than small ones. */
  .app,.app.collapsed{grid-template-columns:1fr;height:auto}
  aside{border-right:none;border-bottom:1px solid var(--line)}
  .scroll{max-height:42vh}
  .sess .av{width:52px;height:52px}
  .sess{gap:10px}
  .sess .vr{flex-wrap:wrap}
  .sess select{font-size:12px}
  .top{flex-wrap:wrap;gap:8px;padding:12px 14px}
  .top h2{font-size:16px}
  .big{padding:9px 14px;font-size:13px}
  .feed{padding:12px 14px 40px}
  .msg{grid-template-columns:1fr}
  .acts{grid-column:1;grid-row:auto;flex-direction:row;margin-top:8px}
  .dismiss,.del{flex:1}
  audio{max-width:100%}
  .prefs{padding:0 14px 14px}
}
</style></head><body>

<div class="app">
  <aside>
    <div class="brand">
      <svg class="logo" viewBox="0 0 32 32" width="21" height="21" aria-hidden="true">
  <g fill="none" stroke="currentColor" stroke-linecap="round">
    <circle cx="9" cy="16" r="2.4" fill="currentColor" stroke="none"/>
    <path d="M12 10.8A6 6 0 0 1 12 21.2"      stroke-width="1.7" opacity=".3"/>
    <path d="M14.25 6.9A10.5 10.5 0 0 1 14.25 25.1" stroke-width="2.1" opacity=".6"/>
    <path d="M16.5 3A15 15 0 0 1 16.5 29"     stroke-width="2.7"/>
  </g>
      </svg>
      <span>Code Vaikhari</span> <span class="st" id="st"></span></div>
    <div class="controls">
      <button id="mute">…</button>
      <button id="stop">stop</button>
    </div>

    <div class="sec">Sessions</div>
    <div class="scroll" id="sessions"></div>

    <div class="prefs">
      <div class="sec" style="border:0;padding-left:0;padding-right:0">Preferences</div>
      <div class="pref">
        <label><input type="checkbox" id="rep"> Repeat undismissed</label>
        <input type="number" id="repmin" min="1" max="240" step="1">
        <span>min</span>
      </div>
      <div class="hint" id="rephint"></div>
    </div>
  </aside>

  <main>
    <div class="top">
      <button class="railtoggle" id="rail" title="Show or hide sessions"
              aria-label="Toggle the sessions panel">☰</button>
      <h2>Inbox<span class="cnt" id="cnt">0</span></h2>
      <span class="grow"></span>
      <button class="big ghost" id="playAll">Play inbox</button>
      <button class="big" id="dismissAll">Dismiss all</button>
    </div>
    <div class="feed" id="feed"></div>
  </main>
</div>

<script>
const VOICES = __VOICES__;
const AVATARS = new Set(__AVATARS__);
const $ = id => document.getElementById(id);
let sig = '';

// Stable hue per project, so a colour means the same repo every time.
const hue = s => { let h = 0; for (const c of s) h = (h * 31 + c.charCodeAt(0)) >>> 0; return h % 360; };
const esc = s => { const d = document.createElement('div'); d.textContent = s ?? ''; return d.innerHTML; };
const when = ts => {
  const d = new Date(ts * 1000), n = new Date();
  const t = d.toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'});
  return d.toDateString() === n.toDateString() ? t
       : d.toLocaleDateString([], {month:'short', day:'numeric'}) + ' ' + t;
};
const post = (url, body) => fetch(url, {method:'POST', body: body ? JSON.stringify(body) : null});

// Wrap any click that talks to the daemon so the button shows it is working.
async function busy(el, fn) {
  if (!el || el.classList.contains('busy')) return;
  el.classList.add('busy');
  try { await fn(); } finally { el.classList.remove('busy'); }
}

// Truncate from the left — the tail of a path is the identifying part. Done in
// JS rather than with direction:rtl, which strands the leading slash on the
// wrong end of the string.
const HOME = __HOME__;
function shortPath(p) {
  if (!p) return '';
  if (p.startsWith(HOME)) p = '~' + p.slice(HOME.length);
  return p.length > 42 ? '…' + p.slice(-41) : p;
}

function drawSessions(ss) {
  $('sessions').innerHTML = ss.length ? ss.map(s => `
    <div class="sess ${s.ended ? 'dead' : ''}" style="--sc:hsl(${hue(s.project)} 60% 47%)">
      ${avatar(s.voice, 80)}
      <div class="col">
        <div class="hd"><span class="nm">${esc(s.label)}</span>
          <span class="pip" title="${s.ended ? 'ended' : 'live'}"></span></div>
        <div class="path" title="${esc(s.cwd || '')}">${esc(shortPath(s.cwd))}</div>
        <div class="vr">
          <select autocomplete="off" onchange="pin('${esc(s.project)}', this.value, '${s.voice}')">
            ${VOICES.map(v => `<option value="${v[0]}"${v[0] === s.voice ? ' selected' : ''}>${v[0]} · ${v[1]}</option>`).join('')}
          </select>
          <button class="hear" onclick="preview(this.previousElementSibling.value, '${esc(s.project)}', this)">hear</button>
        </div>
      </div>
    </div>`).join('') : '<div class="none">No sessions registered yet.</div>';
}

// Kokoro ships no artwork for its voices — they are style tensors, not
// characters — so derive an avatar from the voice name instead. Hue is a hash
// of the name, the monogram is its given name, and British voices carry an
// inner ring. Deterministic, so a voice always looks the same.
function avatar(voice, size) {
  if (AVATARS.has(voice)) {
    return `<img class="av" width="${size}" height="${size}" loading="lazy"
      src="/avatars/${voice}.webp" alt="${esc(voice)}" title="${esc(voice)}">`;
  }
  const given = (voice || '').slice(3) || '?';
  const ring = (voice || '')[0] === 'b';
  const female = (voice || '')[1] === 'f';
  const h = hue(voice || '');
  return `<svg class="av" width="${size}" height="${size}" viewBox="0 0 32 32"
       role="img" aria-label="${esc(voice)}"><title>${esc(voice)} — ${
       ring ? 'British' : 'American'} ${female ? 'female' : 'male'}</title>
    <circle cx="16" cy="16" r="15.5" fill="hsl(${h} 52% 44%)"/>
    ${ring ? '<circle cx="16" cy="16" r="12.6" fill="none" stroke="rgba(255,255,255,.5)" stroke-width="1.5"/>' : ''}
    <text x="16" y="21.4" text-anchor="middle" font-size="14.5" font-weight="600"
          fill="#fff" font-family="ui-sans-serif,system-ui,sans-serif"
          >${esc(given[0].toUpperCase())}</text></svg>`;
}

function card(m, pending) {
  return `<div class="msg ${pending ? 'pending' : 'done'}" style="--sc:hsl(${hue(m.session.split('.')[0])} 60% 47%)">
    <div class="meta">
      ${avatar(m.voice, 40)}
      <span class="tag">${esc(m.session)}</span><span>${when(m.ts)}</span>
      <span>${esc(m.voice)}</span><span>${m.dur}s</span>
      ${m.played ? '' : '<span class="unheard">UNHEARD</span>'}
    </div>
    <div class="body">${esc(m.text)}</div>
    <audio controls preload="none" src="/audio/${m.id}.wav"
           data-id="${m.id}" data-dur="${m.dur}"></audio>
    <div class="acts">
      ${pending ? `<button class="dismiss" onclick="dismiss(this,'${m.id}')">Dismiss</button>` : ''}
      <button class="del" onclick="del(this,'${m.id}')" title="Delete permanently">delete</button>
    </div>
  </div>`;
}

function drawFeed(items, muted) {
  const pending = items.filter(m => !m.dismissed);
  const done = items.filter(m => m.dismissed);
  $('cnt').textContent = pending.length;
  $('cnt').className = 'cnt' + (pending.length ? '' : ' zero');
  document.title = pending.length ? `(${pending.length}) Code Vaikhari`
                                : 'Code Vaikhari';
  $('dismissAll').disabled = !pending.length;
  $('playAll').disabled = !pending.length || muted;
  $('playAll').title = muted ? 'Unmute to play the inbox aloud' : '';

  let html = '';
  if (pending.length) html += pending.map(m => card(m, true)).join('');
  else html += `<div class="empty"><b>Inbox zero</b>Nothing waiting to be dismissed.</div>`;
  if (done.length) html += `<div class="divider">Dismissed</div>` + done.map(m => card(m, false)).join('');
  $('feed').innerHTML = html;
}

async function refresh() {
  const [st, items, ss] = await Promise.all([
    fetch('/api/status').then(r => r.json()),
    fetch('/api/history').then(r => r.json()),
    fetch('/api/sessions').then(r => r.json()),
  ]);

  $('mute').textContent = st.muted ? 'muted' : 'mute';
  $('mute').className = st.muted ? 'on' : '';
  $('st').innerHTML = st.speaking ? '<span class="speaking"><i></i>speaking</span>'
                    : (st.muted ? 'queueing silently' : 'idle');

  if (document.activeElement !== $('repmin')) {
    $('rep').checked = st.repeat_enabled;
    $('repmin').value = st.repeat_minutes;
  }
  $('rephint').textContent = st.repeat_enabled
    ? `Undismissed messages are re-spoken every ${st.repeat_minutes} min` +
      (st.muted ? ', paused while muted.' : '.')
    : 'Messages are spoken once and then wait here.';

  // Cheap change-detection so the DOM (and any playing audio) is left alone
  // when nothing has actually changed.
  const next = JSON.stringify([items.map(i => [i.id, i.dismissed, i.played]),
                               ss.map(s => [s.sid, s.voice, s.ended]), st]);
  if (next === sig) return;
  sig = next;
  drawSessions(ss);
  drawFeed(items, st.muted);
}

async function dismiss(el, id) {
  await busy(el, () => post('/api/dismiss/' + id));
  sig = ''; refresh();
}
async function del(el, id) {
  await busy(el, () => post('/api/delete/' + id));
  sig = ''; refresh();
}
async function pin(project, voice, current) {
  // Browsers restore <select> values across a reload and fire change while
  // doing it, which silently pinned whatever happened to be on screen. Only
  // act on a real change of value.
  if (voice === current) return;
  const sel = event && event.target;
  if (sel) sel.disabled = true;
  try {
    await post('/api/pin', {project, voice});
    await preview(voice, project);
  } finally {
    if (sel) sel.disabled = false;
  }
  sig = ''; refresh();
}
async function preview(voice, project, el) {
  const call = () => post('/api/preview',
    {voice, text: `This is the ${project} session speaking.`});
  return el ? busy(el, call) : call();
}

// These players decode in the browser, so the daemon's queue never sees them:
// serialising them is this page's job. One plays at a time here, and the
// daemon is told to hold off for whatever is left of the clip. Delegated with
// capture because media events do not bubble, and the cards get re-rendered.
const playing = () => [...document.querySelectorAll('audio')].some(a => !a.paused);
const hold = a => post('/api/floor', {seconds: (+a.dataset.dur || 0) - a.currentTime + 1});
const release = () => { if (!playing()) post('/api/floor', {seconds: 0}); };
document.addEventListener('play', e => {
  document.querySelectorAll('audio').forEach(o => { if (o !== e.target) o.pause(); });
  post('/api/heard/' + e.target.dataset.id);
  hold(e.target);
}, true);
// pause() above fires asynchronously, so a release always re-checks rather
// than assuming this element is the only one that could be playing.
document.addEventListener('pause', release, true);
document.addEventListener('ended', release, true);
document.addEventListener('seeked', e => { if (!e.target.paused) hold(e.target); }, true);

$('mute').onclick = async () => {
  const on = $('mute').classList.contains('on');
  await busy($('mute'), () => post('/api/mute', {mute: !on}));
  sig = ''; refresh();
};
$('stop').onclick = () => busy($('stop'), () => post('/api/stop'));
$('playAll').onclick = () => busy($('playAll'), () => post('/api/drain'));
$('dismissAll').onclick = async () => {
  await busy($('dismissAll'), () => post('/api/dismiss-all'));
  sig = ''; refresh();
};
$('rep').onchange      = async () => { await post('/api/prefs', {repeat_enabled: $('rep').checked}); sig = ''; refresh(); };
$('repmin').onchange   = async () => { await post('/api/prefs', {repeat_minutes: +$('repmin').value}); sig = ''; refresh(); };

// Rail state is a preference, so it survives a reload and the 2s refresh.
const app = document.querySelector('.app');
function setRail(collapsed) {
  app.classList.toggle('collapsed', collapsed);
  localStorage.setItem('railCollapsed', collapsed ? '1' : '0');
  $('rail').setAttribute('aria-expanded', String(!collapsed));
}
$('rail').onclick = () => setRail(!app.classList.contains('collapsed'));
// Default to collapsed on a phone, where 376px of rail leaves no inbox.
setRail(localStorage.getItem('railCollapsed') === null
        ? window.innerWidth < 900
        : localStorage.getItem('railCollapsed') === '1');

setInterval(refresh, 2000);
refresh();
</script>
</body></html>
