<!doctype html>
<html><head><meta charset="utf-8">
<title>say</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><text y='13' font-size='14'>%F0%9F%94%8A</text></svg>">
<style>
:root{
  --bg:#f7f6f4; --panel:#fff; --fg:#191817; --dim:#6f6c67; --faint:#9b9791;
  --line:#e4e1dc; --line-soft:#eeecE8;
  --accent:#2f6df6; --accent-fg:#fff;
  --warn:#a35a06; --warn-bg:#fdf3e0; --warn-line:#f0d9ae;
  --live:#1a9f52;
  --radius:10px;
}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){
  --bg:#141417; --panel:#1c1c21; --fg:#e9e7e4; --dim:#9a968f; --faint:#6d6a65;
  --line:#2b2b32; --line-soft:#232329;
  --accent:#6f9dff; --accent-fg:#0d1220;
  --warn:#f0b34a; --warn-bg:#33280f; --warn-line:#4d3c16;
  --live:#43c97c;
}}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);
  font:14.5px/1.5 ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  -webkit-font-smoothing:antialiased}
button,select,input{font:inherit;color:inherit}
button{cursor:pointer}

.app{display:grid;grid-template-columns:296px 1fr;height:100%}

/* ---------------------------------------------------------- sidebar */
aside{background:var(--panel);border-right:1px solid var(--line);
  display:flex;flex-direction:column;min-height:0}
.brand{display:flex;align-items:center;gap:8px;padding:16px 18px 12px;
  font-weight:650;font-size:16px;letter-spacing:-.01em}
.brand .st{margin-left:auto;font-size:11px;font-weight:500;color:var(--dim)}
.controls{display:flex;gap:7px;padding:0 18px 14px}
.controls button{flex:1;background:transparent;border:1px solid var(--line);
  border-radius:8px;padding:7px 0;font-size:12.5px;font-weight:550;color:var(--dim)}
.controls button:hover{border-color:var(--accent);color:var(--fg)}
.controls button.on{background:var(--warn-bg);border-color:var(--warn-line);color:var(--warn)}

.sec{padding:11px 18px 6px;font-size:10.5px;font-weight:700;letter-spacing:.08em;
  text-transform:uppercase;color:var(--faint);border-top:1px solid var(--line-soft)}
.scroll{overflow-y:auto;flex:1;min-height:0;padding:0 12px 12px}

.sess{border-radius:var(--radius);padding:9px 10px;margin-bottom:5px;
  border:1px solid transparent}
.sess:hover{background:var(--bg)}
.sess.dead{opacity:.5}
.sess .hd{display:flex;align-items:center;gap:7px}
.pip{width:8px;height:8px;border-radius:50%;background:var(--sc);flex:none;
  box-shadow:0 0 0 2.5px color-mix(in srgb,var(--sc) 22%,transparent)}
.sess.dead .pip{background:var(--faint);box-shadow:none}
.sess .nm{font-weight:600;font-size:13px;overflow:hidden;text-overflow:ellipsis;
  white-space:nowrap}
.sess .path{font-size:11px;color:var(--faint);margin:2px 0 7px 15px;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sess .vr{display:flex;gap:5px;margin-left:15px}
.sess select{flex:1;min-width:0;background:var(--bg);border:1px solid var(--line);
  border-radius:7px;padding:4px 6px;font-size:11.5px}
.hear{background:transparent;border:1px solid var(--line);border-radius:7px;
  padding:4px 8px;font-size:11px;color:var(--dim)}
.hear:hover{border-color:var(--accent);color:var(--accent)}
.none{color:var(--faint);font-size:12.5px;padding:10px 6px}

/* ---------------------------------------------------------- prefs */
.prefs{border-top:1px solid var(--line);padding:0 18px 16px;background:var(--panel)}
.pref{display:flex;align-items:center;gap:9px;font-size:12.5px;color:var(--dim);
  padding:7px 0}
.pref label{display:flex;align-items:center;gap:8px;cursor:pointer;flex:1}
.pref input[type=number]{width:52px;background:var(--bg);border:1px solid var(--line);
  border-radius:7px;padding:4px 6px;font-size:12.5px;text-align:center}
.pref .hint{font-size:11px;color:var(--faint);line-height:1.4;padding-bottom:4px}
input[type=checkbox]{accent-color:var(--accent);width:15px;height:15px}

/* ---------------------------------------------------------- main */
main{display:flex;flex-direction:column;min-width:0;min-height:0}
.top{display:flex;align-items:center;gap:14px;padding:18px 24px 14px;
  border-bottom:1px solid var(--line)}
h2{margin:0;font-size:17px;font-weight:650;letter-spacing:-.01em}
.cnt{background:var(--warn-bg);color:var(--warn);border:1px solid var(--warn-line);
  border-radius:20px;padding:1px 9px;font-size:12px;font-weight:650;margin-left:8px}
.cnt.zero{background:transparent;border-color:var(--line);color:var(--faint)}
.grow{flex:1}
.big{background:var(--accent);color:var(--accent-fg);border:none;border-radius:9px;
  padding:11px 22px;font-size:14px;font-weight:650;letter-spacing:-.005em;
  box-shadow:0 1px 2px rgba(0,0,0,.14)}
.big:hover{filter:brightness(1.08)}
.big:disabled{background:var(--line);color:var(--faint);box-shadow:none;cursor:default;
  filter:none}
.big.ghost{background:transparent;color:var(--dim);border:1px solid var(--line);
  box-shadow:none;font-weight:600}
.big.ghost:hover{border-color:var(--accent);color:var(--accent);filter:none}
.big.ghost:disabled{background:transparent;color:var(--faint);border-color:var(--line-soft)}
.feed{overflow-y:auto;flex:1;min-height:0;padding:16px 24px 48px}

.msg{background:var(--panel);border:1px solid var(--line);border-radius:12px;
  padding:13px 15px;margin-bottom:10px;display:grid;
  grid-template-columns:1fr auto;gap:4px 14px;align-items:start}
.msg.pending{border-color:var(--warn-line);box-shadow:inset 3px 0 0 var(--sc)}
.msg.done{opacity:.62}
.meta{display:flex;align-items:center;gap:9px;font-size:11.5px;color:var(--faint);
  flex-wrap:wrap;grid-column:1}
.tag{background:var(--sc);color:#fff;border-radius:20px;padding:1.5px 9px;
  font-size:11px;font-weight:650}
.unheard{background:var(--warn-bg);color:var(--warn);border:1px solid var(--warn-line);
  border-radius:20px;padding:.5px 7px;font-size:10px;font-weight:700;letter-spacing:.04em}
.body{grid-column:1;font-size:14.5px;margin:3px 0 8px;white-space:pre-wrap;
  word-break:break-word}
.acts{grid-column:2;grid-row:1/4;display:flex;flex-direction:column;gap:6px;
  align-items:stretch}
.dismiss{background:transparent;border:1px solid var(--accent);color:var(--accent);
  border-radius:8px;padding:7px 15px;font-size:12.5px;font-weight:600;white-space:nowrap}
.dismiss:hover{background:var(--accent);color:var(--accent-fg)}
.del{background:transparent;border:1px solid var(--line);color:var(--faint);
  border-radius:8px;padding:5px 0;font-size:12px}
.del:hover{border-color:#d4482f;color:#d4482f}
audio{grid-column:1;height:32px;width:100%;max-width:380px}
.divider{display:flex;align-items:center;gap:12px;margin:26px 0 14px;
  font-size:10.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;
  color:var(--faint)}
.divider:after{content:"";flex:1;height:1px;background:var(--line)}
.empty{text-align:center;color:var(--faint);padding:64px 20px;font-size:14px}
.empty b{display:block;color:var(--dim);font-size:15.5px;margin-bottom:5px;font-weight:600}

@media(max-width:820px){
  .app{grid-template-columns:1fr;height:auto}
  aside{border-right:none;border-bottom:1px solid var(--line)}
  .scroll{max-height:230px}
  .acts{grid-column:1;grid-row:auto;flex-direction:row}
}
</style></head><body>

<div class="app">
  <aside>
    <div class="brand">say <span class="st" id="st"></span></div>
    <div class="controls">
      <button id="mute">…</button>
      <button id="stop">stop</button>
    </div>

    <div class="sec">Sessions</div>
    <div class="scroll" id="sessions"></div>

    <div class="prefs">
      <div class="sec" style="border:0;padding-left:0;padding-right:0">Preferences</div>
      <div class="pref">
        <label><input type="checkbox" id="rep"> Repeat undismissed</label>
        <input type="number" id="repmin" min="1" max="240" step="1">
        <span>min</span>
      </div>
      <div class="hint" id="rephint"></div>
    </div>
  </aside>

  <main>
    <div class="top">
      <h2>Inbox<span class="cnt" id="cnt">0</span></h2>
      <span class="grow"></span>
      <button class="big ghost" id="playAll">Play inbox</button>
      <button class="big" id="dismissAll">Dismiss all</button>
    </div>
    <div class="feed" id="feed"></div>
  </main>
</div>

<script>
const VOICES = __VOICES__;
const $ = id => document.getElementById(id);
let sig = '';

// Stable hue per project, so a colour means the same repo every time.
const hue = s => { let h = 0; for (const c of s) h = (h * 31 + c.charCodeAt(0)) >>> 0; return h % 360; };
const esc = s => { const d = document.createElement('div'); d.textContent = s ?? ''; return d.innerHTML; };
const when = ts => {
  const d = new Date(ts * 1000), n = new Date();
  const t = d.toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'});
  return d.toDateString() === n.toDateString() ? t
       : d.toLocaleDateString([], {month:'short', day:'numeric'}) + ' ' + t;
};
const post = (url, body) => fetch(url, {method:'POST', body: body ? JSON.stringify(body) : null});

// Truncate from the left — the tail of a path is the identifying part. Done in
// JS rather than with direction:rtl, which strands the leading slash on the
// wrong end of the string.
const HOME = __HOME__;
function shortPath(p) {
  if (!p) return '';
  if (p.startsWith(HOME)) p = '~' + p.slice(HOME.length);
  return p.length > 34 ? '…' + p.slice(-33) : p;
}

function drawSessions(ss) {
  $('sessions').innerHTML = ss.length ? ss.map(s => `
    <div class="sess ${s.ended ? 'dead' : ''}" style="--sc:hsl(${hue(s.project)} 60% 47%)">
      <div class="hd"><span class="pip"></span><span class="nm">${esc(s.label)}</span></div>
      <div class="path" title="${esc(s.cwd || '')}">${esc(shortPath(s.cwd))}</div>
      <div class="vr">
        <select autocomplete="off" onchange="pin('${esc(s.project)}', this.value, '${s.voice}')">
          ${VOICES.map(v => `<option value="${v[0]}"${v[0] === s.voice ? ' selected' : ''}>${v[0]} · ${v[1]}</option>`).join('')}
        </select>
        <button class="hear" onclick="preview(this.previousElementSibling.value, '${esc(s.project)}')">hear</button>
      </div>
    </div>`).join('') : '<div class="none">No sessions registered yet.</div>';
}

function card(m, pending) {
  return `<div class="msg ${pending ? 'pending' : 'done'}" style="--sc:hsl(${hue(m.session.split('.')[0])} 60% 47%)">
    <div class="meta">
      <span class="tag">${esc(m.session)}</span><span>${when(m.ts)}</span>
      <span>${esc(m.voice)}</span><span>${m.dur}s</span>
      ${m.played ? '' : '<span class="unheard">UNHEARD</span>'}
    </div>
    <div class="body">${esc(m.text)}</div>
    <audio controls preload="none" src="/audio/${m.id}.wav"
           onplay="fetch('/api/heard/${m.id}',{method:'POST'})"></audio>
    <div class="acts">
      ${pending ? `<button class="dismiss" onclick="dismiss('${m.id}')">Dismiss</button>` : ''}
      <button class="del" onclick="del('${m.id}')" title="Delete permanently">delete</button>
    </div>
  </div>`;
}

function drawFeed(items, muted) {
  const pending = items.filter(m => !m.dismissed);
  const done = items.filter(m => m.dismissed);
  $('cnt').textContent = pending.length;
  $('cnt').className = 'cnt' + (pending.length ? '' : ' zero');
  document.title = pending.length ? `(${pending.length}) say` : 'say';
  $('dismissAll').disabled = !pending.length;
  $('playAll').disabled = !pending.length || muted;
  $('playAll').title = muted ? 'Unmute to play the inbox aloud' : '';

  let html = '';
  if (pending.length) html += pending.map(m => card(m, true)).join('');
  else html += `<div class="empty"><b>Inbox zero</b>Nothing waiting to be dismissed.</div>`;
  if (done.length) html += `<div class="divider">Dismissed</div>` + done.map(m => card(m, false)).join('');
  $('feed').innerHTML = html;
}

async function refresh() {
  const [st, items, ss] = await Promise.all([
    fetch('/api/status').then(r => r.json()),
    fetch('/api/history').then(r => r.json()),
    fetch('/api/sessions').then(r => r.json()),
  ]);

  $('mute').textContent = st.muted ? 'muted' : 'mute';
  $('mute').className = st.muted ? 'on' : '';
  $('st').textContent = st.muted ? 'queueing silently' : 'speaking';

  if (document.activeElement !== $('repmin')) {
    $('rep').checked = st.repeat_enabled;
    $('repmin').value = st.repeat_minutes;
  }
  $('rephint').textContent = st.repeat_enabled
    ? `Undismissed messages are re-spoken every ${st.repeat_minutes} min` +
      (st.muted ? ', paused while muted.' : '.')
    : 'Messages are spoken once and then wait here.';

  // Cheap change-detection so the DOM (and any playing audio) is left alone
  // when nothing has actually changed.
  const next = JSON.stringify([items.map(i => [i.id, i.dismissed, i.played]),
                               ss.map(s => [s.sid, s.voice, s.ended]), st]);
  if (next === sig) return;
  sig = next;
  drawSessions(ss);
  drawFeed(items, st.muted);
}

async function dismiss(id) { await post('/api/dismiss/' + id); sig = ''; refresh(); }
async function del(id)     { await post('/api/delete/' + id);  sig = ''; refresh(); }
async function pin(project, voice, current) {
  // Browsers restore <select> values across a reload and fire change while
  // doing it, which silently pinned whatever happened to be on screen. Only
  // act on a real change of value.
  if (voice === current) return;
  await post('/api/pin', {project, voice});
  await preview(voice, project);
  sig = ''; refresh();
}
async function preview(voice, project) {
  await post('/api/preview', {voice, text: `This is the ${project} session speaking.`});
}

$('mute').onclick      = async () => { await post('/api/mute', {mute: $('mute').className !== 'on'}); sig = ''; refresh(); };
$('stop').onclick      = () => post('/api/stop');
$('playAll').onclick   = () => post('/api/drain');
$('dismissAll').onclick= async () => { await post('/api/dismiss-all'); sig = ''; refresh(); };
$('rep').onchange      = async () => { await post('/api/prefs', {repeat_enabled: $('rep').checked}); sig = ''; refresh(); };
$('repmin').onchange   = async () => { await post('/api/prefs', {repeat_minutes: +$('repmin').value}); sig = ''; refresh(); };

setInterval(refresh, 2000);
refresh();
</script>
</body></html>
