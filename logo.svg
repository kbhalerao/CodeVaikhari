<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32"
     color="#2f6df6" role="img" aria-label="Code Vaikhari">
  <title>Code Vaikhari</title>
  <!-- The four stages of speech in Sanskrit grammar, innermost outward:
       para (unmanifest source, the dot), pashyanti, madhyama, and vaikhari —
       the audible one, so only the outer arc is fully solid. -->
  <style>
    @media (prefers-color-scheme: dark) { svg { color: #6f9dff } }
  </style>
  <g fill="none" stroke="currentColor" stroke-linecap="round">
    <circle cx="9" cy="16" r="2.4" fill="currentColor" stroke="none"/>
    <path d="M12 10.8A6 6 0 0 1 12 21.2"      stroke-width="1.7" opacity=".3"/>
    <path d="M14.25 6.9A10.5 10.5 0 0 1 14.25 25.1" stroke-width="2.1" opacity=".6"/>
    <path d="M16.5 3A15 15 0 0 1 16.5 29"     stroke-width="2.7"/>
  </g>
</svg>
